<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4a7e"/><stop offset="1" stop-color="#3a2c54"/>
    </linearGradient>
    <pattern id="motif" width="72" height="72" patternUnits="userSpaceOnUse">
      <g fill="#fdfbf7" opacity="0.35" transform="translate(36,36)"><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(0)"/><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(60)"/><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(120)"/><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(180)"/><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(240)"/><ellipse cx="0" cy="-11" rx="4.5" ry="10" transform="rotate(300)"/><circle r="4"/></g>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#motif)" opacity="0.6"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#fdfbf7" stroke-width="2" opacity="0.6"/>
  <circle cx="300" cy="300" r="170" fill="#fdfbf7" opacity="0.14"/>
  <text x="300" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="52"
    fill="#fdfbf7" font-style="italic">Plus</text>
  <text x="300" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="52"
    fill="#fdfbf7" font-style="italic">Size</text>
</svg>